# Maintained in https://github.com/coreos/repo-templates
# Do not edit downstream.

name: ignition-validate
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read

# don't waste job slots on superseded code
concurrency:
  group: {% raw %}${{ github.workflow }}-${{ github.ref }}{% endraw %}
  cancel-in-progress: true

jobs:
  test-validate:
    name: Test ignition-validate
    strategy:
      matrix:
        go-version: [{{ go_versions | last }}]
        os: [macos-latest, windows-latest]
    runs-on: {% raw %}${{ matrix.os }}{% endraw %}
    steps:
    - name: Set up Go 1.x
      uses: actions/setup-go@v5
      with:
        go-version: {% raw %}${{ matrix.go-version }}{% endraw %}
    - name: Check out repository
      uses: actions/checkout@v7
      with:
        persist-credentials: false
    - name: Build ignition-validate
      shell: bash
      run: go build -o ignition-validate github.com/coreos/ignition/v2/validate
    - name: Test ignition-validate
      shell: bash
      run: |
        go test -timeout 60s -cover \
            $(go list ./config/... ./validate/...) --race

  # SENTINEL JOB
  # Require this name in branch protection instead of every
  # matrix-expanded job name (e.g. "Test ignition-validate (1.26.x, macos-latest)").
  required-checks:
    name: required-checks (ignition-validate)
    if: always()
    needs: [test-validate]
    runs-on: ubuntu-slim
    steps:
      - uses: bootc-dev/actions/required-checks@main
        with:
          needs: {% raw %}${{ toJson(needs) }}{% endraw %}
