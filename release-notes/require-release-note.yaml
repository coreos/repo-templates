vars:
  release_notes_path: docs/release-notes.md
  release_notes_path_regex: ~
  release_notes_status: ~
  release_notes_validation_command: ~
  release_notes_skip_label: skip-notes

files:
  - repo: afterburn
    path: .github/workflows/require-release-note.yml

  - repo: coreos-installer
    path: .github/workflows/require-release-note.yml

  - repo: envsubst-rs
    path: .github/workflows/require-release-note.yml

  - repo: ignition
    path: .github/workflows/require-release-note.yml
    vars:
      release_notes_path_regex: '^docs/release-notes\.d/[a-z0-9]+(-[a-z0-9]+)*\.(breaking|feature|change|bugfix)\.md$'
      release_notes_status: added
      release_notes_validation_command: go run ./internal/util/tools/release-notes validate

  - repo: ignition-config-rs
    path: .github/workflows/require-release-note.yml

  - repo: liboverdrop-rs
    path: .github/workflows/require-release-note.yml

  - repo: openssh-keys
    path: .github/workflows/require-release-note.yml

  - repo: stream-metadata-go
    path: .github/workflows/require-release-note.yml

  - repo: stream-metadata-rust
    path: .github/workflows/require-release-note.yml

  - repo: vmw_backdoor-rs
    path: .github/workflows/require-release-note.yml
